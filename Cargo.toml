[workspace]
resolver = "3"
members = [
  "apps/historyworld-cli",
  "apps/historyworld-server",
  "crates/historyworld-content",
  "crates/historyworld-domain",
  "crates/historyworld-sim",
  "crates/historyworld-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
authors = ["HistoryWorld contributors"]

[workspace.dependencies]
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "query", "tokio"] }
blake3 = "1.8.2"
historyworld-content = { path = "crates/historyworld-content" }
historyworld-domain = { path = "crates/historyworld-domain" }
historyworld-sim = { path = "crates/historyworld-sim" }
historyworld-storage = { path = "crates/historyworld-storage" }
http = "1.3.1"
http-body = "1.0.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.2", features = ["limit"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[profile.bench]
debug = 1
lto = "thin"
