name: foundation

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.x"
          cache: false
      - name: Install pinned developer tools
        run: make setup
      - name: Text format
        run: make format-check-text
      - name: Markdown lint
        run: make lint-text
      - name: GitHub Actions lint
        run: make workflow-check
      - name: OpenAPI lint
        run: make openapi-check
      - name: Protobuf format
        run: make format-check-proto
      - name: Protobuf lint
        run: make proto-check

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup show
      - name: Format
        run: make format-check-rust
      - name: Check
        run: make check
      - name: Clippy
        run: make lint-rust
      - name: Tests
        run: make test
      - name: Validate bundled release
        run: make validate
